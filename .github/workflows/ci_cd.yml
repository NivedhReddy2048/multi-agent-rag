name: EKIP v1.0.0 CI/CD Production Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Integration Tests
        run: |
          python -m pytest tests/test_knowledge_synthesis.py tests/test_student_workspace.py tests/test_knowledge_verification.py tests/test_learning_modules.py tests/test_production_engineering.py tests/test_multi_user_platform.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Container
        run: |
          docker build -t ekip-platform:v1.0.0 .
